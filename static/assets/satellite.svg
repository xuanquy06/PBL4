<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="glowSat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbit Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#f4c96b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="60" cy="60" r="46" fill="#07111c" fill-opacity="0.85" stroke="#f4c96b" stroke-width="1.5" />

  <!-- Left Solar Wing -->
  <rect x="12" y="48" width="30" height="24" rx="2" fill="url(#solarGrad)" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="22" y1="48" x2="22" y2="72" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="32" y1="48" x2="32" y2="72" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="12" y1="60" x2="42" y2="60" stroke="#93c5fd" stroke-width="0.8"/>
  <!-- Left Wing Mount Boom -->
  <line x1="42" y1="60" x2="48" y2="60" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Right Solar Wing -->
  <rect x="78" y="48" width="30" height="24" rx="2" fill="url(#solarGrad)" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="88" y1="48" x2="88" y2="72" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="98" y1="48" x2="98" y2="72" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="78" y1="60" x2="108" y2="60" stroke="#93c5fd" stroke-width="0.8"/>
  <!-- Right Wing Mount Boom -->
  <line x1="72" y1="60" x2="78" y2="60" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Satellite Bus / Main Body (Gold Foil) -->
  <rect x="48" y="44" width="24" height="32" rx="3" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="52" y="48" width="16" height="24" fill="#0f172a" fill-opacity="0.6" rx="2"/>

  <!-- Earth-Facing Antenna Dish (Downwards) -->
  <path d="M 50 82 Q 60 76 70 82 Z" fill="#94a3b8" stroke="#f4c96b" stroke-width="1.5"/>
  <line x1="60" y1="78" x2="60" y2="87" stroke="#f4c96b" stroke-width="2"/>
  <circle cx="60" cy="87" r="2.5" fill="#f4c96b" filter="url(#glowSat)"/>

  <!-- Downlink Beam / Waves -->
  <path d="M 54 94 Q 60 98 66 94" fill="none" stroke="#f4c96b" stroke-width="1.5" opacity="0.8"/>
  <path d="M 48 100 Q 60 106 72 100" fill="none" stroke="#f4c96b" stroke-width="1.2" opacity="0.5"/>

  <!-- Sensor Optical Aperture on top -->
  <circle cx="60" cy="54" r="3.5" fill="#38bdf8"/>
  <circle cx="60" cy="64" r="2" fill="#22c55e" filter="url(#glowSat)"/>
</svg>
