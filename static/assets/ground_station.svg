<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69e3a3" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pulse Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#69e3a3" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="60" cy="60" r="46" fill="#07111c" fill-opacity="0.85" stroke="#69e3a3" stroke-width="1.5" />

  <!-- Base Structure / Foundation -->
  <rect x="36" y="86" width="48" height="10" rx="3" fill="#1e293b" stroke="#69e3a3" stroke-width="1.5"/>
  <polygon points="50,86 70,86 65,68 55,68" fill="#334155" stroke="#69e3a3" stroke-width="1.5"/>

  <!-- Parabolic Dish -->
  <!-- Tilted parabolic arc -->
  <path d="M 34 46 C 42 28, 78 28, 86 46 C 74 40, 46 40, 34 46 Z" fill="#0f2b24" stroke="#69e3a3" stroke-width="2"/>
  <!-- Subreflector / Feed Horn Struts -->
  <line x1="42" y1="36" x2="60" y2="24" stroke="#64748b" stroke-width="1.5"/>
  <line x1="78" y1="36" x2="60" y2="24" stroke="#64748b" stroke-width="1.5"/>
  <!-- Feed Horn -->
  <circle cx="60" cy="24" r="3.5" fill="#69e3a3" filter="url(#glowGreen)"/>

  <!-- Signal Emission Arcs -->
  <path d="M 50 16 A 14 14 0 0 1 70 16" fill="none" stroke="#69e3a3" stroke-width="1.5" opacity="0.8"/>
  <path d="M 44 11 A 22 22 0 0 1 76 11" fill="none" stroke="#69e3a3" stroke-width="1.2" opacity="0.5"/>
  <path d="M 38 6 A 30 30 0 0 1 82 6" fill="none" stroke="#69e3a3" stroke-width="1" opacity="0.3"/>

  <!-- Center Pivot / Hub -->
  <circle cx="60" cy="56" r="6" fill="#064e3b" stroke="#69e3a3" stroke-width="2"/>
  <circle cx="60" cy="56" r="2.5" fill="#69e3a3"/>

  <!-- Status LED -->
  <circle cx="42" cy="91" r="2" fill="#22c55e" filter="url(#glowGreen)"/>
  <circle cx="48" cy="91" r="2" fill="#38bdf8"/>
  <circle cx="54" cy="91" r="2" fill="#69e3a3"/>
</svg>
