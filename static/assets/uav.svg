<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="uavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45d5e8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45d5e8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#45d5e8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pulse Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#45d5e8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="60" cy="60" r="46" fill="#07111c" fill-opacity="0.85" stroke="#45d5e8" stroke-width="1.5" />

  <!-- Drone Arms (Diagonal Cross) -->
  <line x1="28" y1="28" x2="92" y2="92" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="92" x2="92" y2="28" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="92" y2="92" stroke="#45d5e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="92" x2="92" y2="28" stroke="#45d5e8" stroke-width="2" stroke-linecap="round"/>

  <!-- Rotor Discs / Propeller Blur -->
  <!-- Top-Left -->
  <circle cx="28" cy="28" r="14" fill="#45d5e8" fill-opacity="0.15" stroke="url(#bladeGrad)" stroke-width="1.5"/>
  <circle cx="28" cy="28" r="4" fill="#0f172a" stroke="#45d5e8" stroke-width="2"/>
  <!-- Top-Right -->
  <circle cx="92" cy="28" r="14" fill="#45d5e8" fill-opacity="0.15" stroke="url(#bladeGrad)" stroke-width="1.5"/>
  <circle cx="92" cy="28" r="4" fill="#0f172a" stroke="#45d5e8" stroke-width="2"/>
  <!-- Bottom-Left -->
  <circle cx="28" cy="92" r="14" fill="#45d5e8" fill-opacity="0.15" stroke="url(#bladeGrad)" stroke-width="1.5"/>
  <circle cx="28" cy="92" r="4" fill="#0f172a" stroke="#45d5e8" stroke-width="2"/>
  <!-- Bottom-Right -->
  <circle cx="92" cy="92" r="14" fill="#45d5e8" fill-opacity="0.15" stroke="url(#bladeGrad)" stroke-width="1.5"/>
  <circle cx="92" cy="92" r="4" fill="#0f172a" stroke="#45d5e8" stroke-width="2"/>

  <!-- Drone Central Fuselage -->
  <polygon points="60,38 76,52 72,74 60,82 48,74 44,52" fill="#0e2238" stroke="#45d5e8" stroke-width="2"/>
  <!-- Sensor / Gimbal Camera Lens -->
  <circle cx="60" cy="56" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="60" cy="56" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
  <circle cx="60" cy="70" r="2.5" fill="#22c55e"/>

  <!-- Forward indicator arrow -->
  <path d="M 57 44 L 60 40 L 63 44 Z" fill="#45d5e8"/>
</svg>
